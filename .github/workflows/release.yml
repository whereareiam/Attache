name: Release build

on:
  release:
    types: [ created ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          check-latest: true

      - name: Set version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          echo "VERSION=${TAG_NAME#v}" >> $GITHUB_ENV

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test results
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          find . -name "TEST-*.xml" -type f | while read file; do
            suite=$(grep -oP 'name="\K[^"]+' "$file" | head -1)
            tests=$(grep -oP 'tests="\K[^"]+' "$file" | head -1)
            failures=$(grep -oP 'failures="\K[^"]+' "$file" | head -1)
            errors=$(grep -oP 'errors="\K[^"]+' "$file" | head -1)
            echo "- **$suite**: $tests tests, $failures failures, $errors errors" >> $GITHUB_STEP_SUMMARY
          done

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          check-latest: true

      - name: Set version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          echo "VERSION=${TAG_NAME#v}" >> $GITHUB_ENV

      - name: Publish to Maven repository
        env:
          PUBLISH_USER: ${{ secrets.PUBLISH_USER }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_REALM: release
        run: ./gradlew --no-daemon publish

