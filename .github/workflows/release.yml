name: Release build

on:
  release:
    types: [published]

permissions:
  contents: write
  checks: write
  id-token: write

concurrency:
  group: attache-release
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build and test once
        uses: ./.github/actions/gradle-build
        with:
          gradle-command: ./gradlew --no-daemon build
          java-version: '25'
          test-results-artifact-name: attache-release-${{ github.event.release.tag_name }}

      - name: Publish Maven modules
        uses: whereareiam/devops/actions/registry/maven-publish@v2
        with:
          visibility: public
          repository: packages
          command: ./gradlew --no-daemon publish

      - name: Add build artifacts to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -t artifacts < <(find . -path '*/build/libs/*.jar' -type f ! -name '*plain*.jar' ! -name '*test*.jar' -print)
          ((${#artifacts[@]} > 0))
          gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
