name: Development build

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  id-token: write

concurrency:
  group: attache-development
  cancel-in-progress: false

jobs:
  build-test-publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERSION: dev-${{ github.sha }}-SNAPSHOT
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: dev

      - name: Build and test once
        uses: ./.github/actions/gradle-build
        with:
          gradle-command: ./gradlew --no-daemon build
          java-version: '25'
          test-results-artifact-name: attache-development-${{ github.sha }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: attache-development-${{ github.sha }}-jars
          path: '**/build/libs/*.jar'
          if-no-files-found: error

      - name: Publish Maven modules
        uses: whereareiam/devops/actions/registry/maven-publish@v2
        with:
          visibility: public
          repository: packages
          command: ./gradlew --no-daemon publish
